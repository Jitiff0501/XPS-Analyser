name: build-exe
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller pandas openpyxl xlrd
      - run: python -m unittest -v test_avantage_to_xpspeak.py
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name Avantage2XPSPEAK --exclude-module matplotlib --exclude-module scipy --exclude-module IPython avantage_to_xpspeak.py
      - uses: actions/upload-artifact@v4
        with:
          name: Avantage2XPSPEAK-windows
          path: dist/Avantage2XPSPEAK.exe
      - name: Publish to Releases (latest)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/Avantage2XPSPEAK.exe --title "Avantage2XPSPEAK (Windows)" --notes "双击运行，选择 .VGD 文件即可转换为 XPSPEAK 4.1 格式。" --target "$GITHUB_SHA"

name: build-exe
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller pandas openpyxl xlrd numpy scipy matplotlib pywebview
      - name: Tests
        run: python -m unittest -v test_avantage_to_xpspeak.py test_xpsfit_core.py
      - name: Build Avantage2XPSPEAK.exe (converter)
        run: python -m PyInstaller --noconfirm --onefile --windowed --name Avantage2XPSPEAK --exclude-module matplotlib --exclude-module scipy --exclude-module IPython --exclude-module webview avantage_to_xpspeak.py
      - name: Build XPSAnalyser.exe (fitting app)
        run: >-
          python -m PyInstaller --noconfirm --onefile --windowed --name XPSAnalyser
          --icon assets/icon.ico
          --add-data "xpsfit/web;xpsfit/web"
          --add-data "xpsfit/sensitivity_factors.json;xpsfit"
          --add-data "xpsfit/reference;xpsfit/reference"
          --hidden-import avantage_to_xpspeak
          --exclude-module IPython --exclude-module PyQt5 --exclude-module PySide6 --exclude-module tkinter
          run_xpsfit.py
      - name: Smoke test (run the packaged exe headless)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          $env:XPSFIT_SMOKE = "$PWD\smoke\result.txt"
          $env:XPSFIT_SMOKE_VGD = "$PWD\tests_data\Al2p Scan.VGD"
          $p = Start-Process -FilePath "dist\XPSAnalyser.exe" -PassThru -Wait
          Get-Content smoke\result.txt
          if (-not (Select-String -Path smoke\result.txt -Pattern '^OK$' -Quiet)) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple Silicon (M1–M4)；macos-14 镜像已停用
            arch: arm64
            experimental: false
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller pandas openpyxl xlrd numpy scipy matplotlib pywebview
      - name: Tests
        run: python -m unittest -v test_avantage_to_xpspeak.py test_xpsfit_core.py
      - name: Build "XPS Analyser.app"
        run: >-
          python -m PyInstaller --noconfirm --windowed --name "XPS Analyser"
          --icon assets/icon.icns
          --osx-bundle-identifier org.xpsanalyser.app
          --add-data "xpsfit/web:xpsfit/web"
          --add-data "xpsfit/sensitivity_factors.json:xpsfit"
          --add-data "xpsfit/reference:xpsfit/reference"
          --hidden-import avantage_to_xpspeak
          --exclude-module IPython --exclude-module PyQt5 --exclude-module PySide6 --exclude-module tkinter
          run_xpsfit.py
      - name: Build "Avantage2XPSPEAK.app" (converter)
        run: >-
          python -m PyInstaller --noconfirm --windowed --name "Avantage2XPSPEAK"
          --osx-bundle-identifier org.xpsanalyser.converter
          --exclude-module matplotlib --exclude-module scipy --exclude-module IPython --exclude-module webview
          avantage_to_xpspeak.py
      - name: Smoke test (run the packaged app headless)
        run: |
          mkdir -p smoke
          XPSFIT_SMOKE="$PWD/smoke/result.txt" XPSFIT_SMOKE_VGD="$PWD/tests_data/Al2p Scan.VGD" \
            "dist/XPS Analyser.app/Contents/MacOS/XPS Analyser"
          cat smoke/result.txt
          grep -qx OK smoke/result.txt
      - name: Zip apps (keep bundle structure)
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/XPS Analyser.app" "XPSAnalyser-macOS-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/Avantage2XPSPEAK.app" "Avantage2XPSPEAK-macOS-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: "*.zip"

  release:
    if: github.ref == 'refs/heads/main'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Keep v1.0 (the build published before versioned releases)
        run: |
          NOTES="XPS Analyser v1.0（版本号启用前发布的版本，原样保留）。更新内容见 CHANGELOG.md。"
          if gh release view v1.0 >/dev/null 2>&1; then exit 0; fi
          if [ "$(gh release view latest --json name --jq .name 2>/dev/null)" = "XPS Analyser v1.0" ]; then exit 0; fi
          if ! gh release view latest >/dev/null 2>&1; then exit 0; fi
          sha=$(gh api "repos/$GH_REPO/git/ref/tags/latest" --jq .object.sha)
          mkdir -p v10 && gh release download latest -D v10
          # 1) 在 v1.0 的提交上建标签（不新增提交），再挂上 v1.0 的文件
          if git fetch --no-tags --depth=1 origin "$sha" && git tag v1.0 "$sha" && git push origin refs/tags/v1.0 \
             && gh release create v1.0 v10/* --verify-tag --latest=false --title "XPS Analyser v1.0" --notes "$NOTES"; then
            exit 0
          fi
          # 2) 不允许在旧提交上建标签时：原来的 latest 发布（正是 v1.0 的文件）原地改名为 v1.0 保留，滚动构建改用 latest-build
          echo "::warning::v1.0 tag could not be created; keeping v1.0 on the existing 'latest' tag"
          gh release edit latest --title "XPS Analyser v1.0" --notes "$NOTES" --prerelease=false --latest=false
      - name: Publish versioned release
        run: |
          ls -la out
          V=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' xpsfit/__init__.py)
          awk -v v="## v$V" '$0 ~ "^## v" {p = index($0, v) == 1} p' CHANGELOG.md > notes.md
          printf '\n---\nWindows：XPSAnalyser.exe（拟合程序）、Avantage2XPSPEAK.exe（转换器），双击运行。\nmacOS：XPSAnalyser-macOS-arm64.zip（Apple 芯片 M1–M4），解压后把 XPS Analyser 拖到“应用程序”；首次打开：右键 → 打开（未签名程序）。\n' >> notes.md
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" out/* --clobber
            gh release edit "v$V" --notes-file notes.md --latest
          else
            gh release create "v$V" out/* --target "$GITHUB_SHA" --title "XPS Analyser v$V" --notes-file notes.md --latest
          fi
      - name: Rolling latest build (keeps old download links working)
        run: |
          R=latest
          if [ "$(gh release view latest --json name --jq .name 2>/dev/null)" = "XPS Analyser v1.0" ]; then R=latest-build; fi
          gh release delete "$R" --yes --cleanup-tag || true
          gh release create "$R" out/* --target "$GITHUB_SHA" --prerelease --title "XPS Analyser（最新构建 / latest build）" \
            --notes "每次更新自动构建的最新版本；正式版本见 v1.0、v1.1 ……（Releases 列表）。"
